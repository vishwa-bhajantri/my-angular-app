    </h2>

    <div class="card shadow-sm mb-4">

        <div class="card-header bg-primary text-white">
            Creating and Reading Signal
        </div>

        <div class="card-body">
            <h4>
                Employee Name : {{EmployeeName()}}
            </h4>
            <h4>
                Employee Count : {{EmployeeCount()}}
            </h4>

        </div>
    </div>


<!-- Example -->
    <div class="card shadow-sm mb-4">

        <div class="card-header bg-primary text-white">

        </div>

        <div class="card-body">
            <h4>
                Employee Name : {{EmployeeName()}}
            </h4>

            <button class="btn btn-success" (click)="changeEmployee()">
                Change Employee
            </button>

        </div>
    </div>
